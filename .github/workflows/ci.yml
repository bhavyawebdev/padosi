name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Validate backend syntax
        run: python -m compileall backend/app

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run typecheck
        run: |
          cd frontend
          npm run typecheck
      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build backend container image
        run: docker build -t localpulse-backend:ci -f backend/Dockerfile backend
      - name: Build frontend container image
        run: docker build -t localpulse-frontend:ci -f frontend/Dockerfile frontend
