services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: localpulse-db
    environment:
      POSTGRES_USER: localpulse
      POSTGRES_PASSWORD: localpulse
      POSTGRES_DB: localpulse
    ports:
      - "5432:5432"
    volumes:
      - localpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localpulse -d localpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: localpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - localpulse_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localpulse_pgdata:
  localpulse_redisdata:
