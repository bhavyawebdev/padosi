<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: theme('colors.outline-variant');
            border-radius: theme('borderRadius.full');
        }

        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: theme('colors.primary');
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="antialiased min-h-screen flex flex-col justify-end md:justify-center items-center p-0 md:p-margin-desktop bg-surface-dim">
<!-- Top App Bar (Hidden on Mobile, Visible on Desktop as part of app shell if needed, but suppressed here as it's a modal flow) -->
<!-- Navigation Shell suppressed because this is a focused task/transactional flow -->
<!-- Modal Container -->
<main class="w-full md:max-w-md bg-background md:rounded-[24px] rounded-t-[24px] shadow-lg flex flex-col overflow-hidden h-[795px] md:h-auto animate-[slideUp_0.3s_ease-out]">
<!-- Header -->
<header class="flex justify-between items-center px-margin-mobile py-md bg-background border-b border-surface-variant">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-variant text-on-surface-variant transition-colors group">
<span class="material-symbols-outlined transition-transform group-hover:scale-110">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-background flex-1 text-center font-bold tracking-tight">What's happening in Bandra?</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto px-margin-mobile py-lg space-y-xl">
<!-- Type Selection -->
<section class="space-y-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Type of Post</h2>
<div class="grid grid-cols-3 gap-sm">
<!-- Option: Alert -->
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline-variant rounded-xl hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent group">
<span class="material-symbols-outlined text-secondary text-[32px] mb-xs group-hover:-translate-y-1 transition-transform" data-icon="campaign" style="font-variation-settings: 'FILL' 1;">campaign</span>
<span class="font-label-sm text-label-sm text-on-surface">Alert</span>
</button>
<!-- Option: Ask for Help -->
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline-variant rounded-xl hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent group">
<span class="material-symbols-outlined text-primary text-[32px] mb-xs group-hover:-translate-y-1 transition-transform" data-icon="volunteer_activism">volunteer_activism</span>
<span class="font-label-sm text-label-sm text-on-surface">Ask for Help</span>
</button>
<!-- Option: Offer/Borrow -->
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline-variant rounded-xl hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent group">
<span class="material-symbols-outlined text-tertiary-container text-[32px] mb-xs group-hover:-translate-y-1 transition-transform" data-icon="handshake">handshake</span>
<span class="font-label-sm text-label-sm text-on-surface">Offer/Borrow</span>
</button>
</div>
</section>
<!-- Text Area -->
<section class="space-y-xs">
<label class="sr-only" for="post-details">Post Details</label>
<div class="relative bg-surface rounded-xl border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-shadow">
<textarea class="w-full bg-transparent border-none rounded-xl p-md font-body-md text-body-md text-on-background placeholder:text-outline focus:ring-0 resize-none" id="post-details" placeholder="Share details..." rows="5"></textarea>
<!-- Media Attachment Buttons -->
<div class="absolute bottom-sm left-sm flex gap-xs">
<button aria-label="Add Photo" class="p-2 rounded-full text-primary hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="add_photo_alternate">add_photo_alternate</span>
</button>
<button aria-label="Add Location" class="p-2 rounded-full text-primary hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="location_on">location_on</span>
</button>
</div>
</div>
</section>
<!-- Urgent Toggle -->
<section class="flex items-center justify-between p-md bg-surface rounded-xl border border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-error" data-icon="error" style="font-variation-settings: 'FILL' 1;">error</span>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Urgent?</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Notify neighbors immediately</p>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-variant appearance-none cursor-pointer z-10 transition-all duration-300 left-0 top-0" id="urgent-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300" for="urgent-toggle"></label>
</div>
</section>
</div>
<!-- Footer Action -->
<footer class="p-margin-mobile bg-surface-container-low border-t border-surface-variant shadow-[0_-1px_4px_rgba(0,0,0,0.05)]">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm px-lg rounded-full hover:bg-primary/90 hover:shadow-sm transition-all flex items-center justify-center gap-xs focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
                Post to Neighborhood
            </button>
</footer>
</main>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
<script>
        // Simple script to handle visual toggle state if needed beyond CSS
        const toggle = document.getElementById('urgent-toggle');
        const toggleLabel = document.querySelector('.toggle-label');
        
        toggle.addEventListener('change', function() {
            if(this.checked) {
                toggleLabel.classList.remove('bg-surface-variant');
                toggleLabel.classList.add('bg-error');
                this.classList.add('border-error');
                this.classList.remove('border-surface-variant');
                this.style.left = '1.5rem';
            } else {
                toggleLabel.classList.add('bg-surface-variant');
                toggleLabel.classList.remove('bg-error');
                this.classList.remove('border-error');
                this.classList.add('border-surface-variant');
                this.style.left = '0';
            }
        });
    </script>
</body></html>
