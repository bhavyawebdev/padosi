# supabase/config.toml — Local Supabase development configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
# Realtime is used selectively — only for in-app notifications and live feed updates

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
# Used for: user avatars, post images
file_size_limit = "5MiB"
image_transformation = { enabled = false }

[auth]
enabled = true
# Site URL — update for production
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Email + password authentication (MVP)
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_expiry = 86400 # 24 hours for email confirmation

# SMS / Phone OTP — disabled for free MVP
# Can be enabled later without schema changes
[auth.sms]
enable_signup = false

# Google OAuth — optional, can be enabled by adding credentials
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""

[analytics]
enabled = false

[functions]
# Edge Functions directory
verify_jwt = true

[experimental]
# PostGIS extension for geographic queries
# Enable via migration: CREATE EXTENSION IF NOT EXISTS postgis;
